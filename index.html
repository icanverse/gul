<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Işıl’a Bir Not</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,500&display=swap">
<style>
:root{
  --bg1:#fbf0e8; --bg2:#eccfc6; --ink:#5c0f1d; --card:#fffaf5; --line:#e0bdb3;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg1:#2c0b14;--bg2:#12040a;--ink:#fbe4de;--card:#3a1520;--line:#6b2c3a;color-scheme:dark}
}
:root[data-theme="dark"]{--bg1:#2c0b14;--bg2:#12040a;--ink:#fbe4de;--card:#3a1520;--line:#6b2c3a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 42%,var(--bg1),var(--bg2));
  font-family:'Playfair Display',Georgia,'Times New Roman',serif;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#note{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:1;width:min(60vw,260px);text-align:center;
  color:var(--ink);opacity:0;transition:opacity .7s ease;pointer-events:none}
#note p{margin:0;font-style:italic;font-weight:500;font-size:clamp(1.45rem,7.2vw,2.1rem);line-height:1.35;text-shadow:0 0 24px rgba(220,40,70,.25)}
#note i{display:block;margin:14px auto 0;width:46px;height:1px;background:var(--ink);opacity:.45}
#title{position:fixed;left:0;right:0;top:0;transform:translateY(-50%);z-index:1;text-align:center;color:var(--ink);font-style:italic;font-weight:500;font-size:clamp(1.7rem,8.5vw,2.6rem);pointer-events:none;opacity:0;animation:tin 1.2s .3s ease forwards;text-shadow:0 0 28px rgba(220,40,70,.3)}
@keyframes tin{to{opacity:1}}
#c{position:fixed;inset:0;width:100%;height:100%;z-index:2;touch-action:none;display:block}
#hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);text-align:center;z-index:3;
  color:var(--ink);font-size:1rem;letter-spacing:.04em;opacity:.7;pointer-events:none;transition:opacity .5s;animation:pulse 2s ease-in-out infinite}
#hint.off{opacity:0;animation:none}
@keyframes pulse{50%{transform:translateY(-4px)}}
#btn{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);transform:translateX(-50%);z-index:3;
  font:inherit;font-size:.95rem;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 20px;
  opacity:0;pointer-events:none;transition:opacity .4s;cursor:pointer}
#btn.show{opacity:1;pointer-events:auto}
@media (prefers-reduced-motion: reduce){#hint{animation:none}}
</style>
</head>
<body>
<div id="title">Işıl’a Bir Not</div>
<div id="note"><p>Kalbimin ortasında bu nasıl bir cumhuriyet</p><i></i></div>
<canvas id="c"></canvas>
<div id="hint">güllere dokun</div>
<button id="btn" type="button">Yeniden topla</button>
<script>
(function(){
var cv=document.getElementById('c'),ctx=cv.getContext('2d'),note=document.getElementById('note'),hint=document.getElementById('hint'),btn=document.getElementById('btn'),ttl=document.getElementById('title');
var rm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var W,H,U,dpr,floorPad=0,relN=0,lastOp=-1,lastBtn=false,TAU=Math.PI*2,TX=0,TY=0,PX=0,PY=0,QX=0,QY=0,FS=.72,tiltOn=false;

/* ---------- sprites ---------- */
function mk(f){var c=document.createElement('canvas');c.width=c.height=280;var g=c.getContext('2d');g.translate(140,140);f(g);return c;}
var PAL={
 red:{hi:'#f25a70',mid:'#c4122f',lo:'#760a1b',edge:'rgba(55,0,10,.5)'},
 white:{hi:'#ffffff',mid:'#f8f0e8',lo:'#c9baaa',edge:'rgba(110,85,60,.42)'}
};
function petal(g,d,rx,ry,rot,c1,c2,edge){
  g.save();g.rotate(rot);g.translate(0,-d);
  var gr=g.createRadialGradient(0,-ry*.4,0,0,0,ry*1.1);gr.addColorStop(0,c1);gr.addColorStop(1,c2);
  g.beginPath();g.ellipse(0,0,rx,ry,0,0,TAU);g.fillStyle=gr;g.fill();
  g.lineWidth=1.6;g.strokeStyle=edge;g.stroke();g.restore();
}
function roseSprite(p){return mk(function(g){
  var R=112,i;
  g.shadowColor='rgba(40,0,10,.45)';g.shadowBlur=14;g.shadowOffsetY=5;
  for(i=0;i<7;i++)petal(g,.5*R,.44*R,.48*R,i*TAU/7,p.hi,p.lo,p.edge);
  g.shadowColor='transparent';
  for(i=0;i<5;i++)petal(g,.32*R,.36*R,.4*R,.4+i*TAU/5,p.hi,p.mid,p.edge);
  for(i=0;i<4;i++)petal(g,.16*R,.26*R,.3*R,.9+i*Math.PI/2,p.hi,p.mid,p.edge);
  g.beginPath();g.arc(0,0,.15*R,0,TAU);g.fillStyle=p.lo;g.fill();
  g.strokeStyle=p.edge;g.lineWidth=2.2;g.beginPath();
  for(var t=0;t<12;t+=.2){var r=t*.012*R,x=Math.cos(t)*r,y=Math.sin(t)*r;t?g.lineTo(x,y):g.moveTo(x,y);}
  g.stroke();
  g.shadowColor='transparent';g.globalCompositeOperation='source-atop';
  var L=g.createRadialGradient(-R*.35,-R*.4,R*.1,0,0,R*1.15);
  L.addColorStop(0,'rgba(255,255,255,.3)');L.addColorStop(.5,'rgba(255,255,255,0)');L.addColorStop(1,'rgba(30,0,10,.4)');
  g.fillStyle=L;g.fillRect(-140,-140,280,280);g.globalCompositeOperation='source-over';
});}
var SPR={
 red:roseSprite(PAL.red),
 white:roseSprite(PAL.white),
 leaf:mk(function(g){
  g.shadowColor='rgba(0,30,10,.4)';g.shadowBlur=10;g.shadowOffsetY=4;
  var gr=g.createLinearGradient(-110,0,110,0);gr.addColorStop(0,'#2f5a30');gr.addColorStop(1,'#5f9a58');
  g.beginPath();g.moveTo(-108,0);g.bezierCurveTo(-50,-72,60,-72,108,0);g.bezierCurveTo(60,72,-50,72,-108,0);
  g.fillStyle=gr;g.fill();g.shadowColor='transparent';
  g.strokeStyle='rgba(20,55,25,.6)';g.lineWidth=2.5;g.beginPath();g.moveTo(-108,0);g.lineTo(90,0);g.stroke();
 }),
 bow:mk(function(g){
  g.shadowColor='rgba(40,0,10,.4)';g.shadowBlur=10;g.shadowOffsetY=4;
  var gr=g.createLinearGradient(0,-60,0,60);gr.addColorStop(0,'#e0304a');gr.addColorStop(1,'#8c0c20');
  g.fillStyle=gr;g.strokeStyle='#5e0715';g.lineWidth=2.5;
  [1,-1].forEach(function(s){
   g.beginPath();g.moveTo(0,0);g.bezierCurveTo(s*60,-78,s*128,-34,s*104,12);g.bezierCurveTo(s*124,56,s*58,64,0,0);g.fill();g.stroke();
  });
  [[-1,0],[1,0]].forEach(function(a){
   g.beginPath();g.moveTo(a[0]*6,8);g.lineTo(a[0]*58,112);g.lineTo(a[0]*30,100);g.lineTo(a[0]*14,118);g.lineTo(a[0]*-2,12);g.closePath();g.fill();g.stroke();
  });
  g.beginPath();g.arc(0,0,17,0,TAU);g.fill();g.stroke();
 })
};
var SPRD={};
Object.keys(SPR).forEach(function(k){SPRD[k]=[0,1].map(function(n){var c=document.createElement('canvas');c.width=c.height=280;var g=c.getContext('2d');g.drawImage(SPR[k],0,0);g.globalCompositeOperation='source-atop';g.fillStyle='rgba(25,0,10,'+(n?.34:.17)+')';g.fillRect(0,0,280,280);return c;});});

/* ---------- bodies ---------- */
var ITEMS=[
 ['leaf',-.30,-.22,.17,-.7],['leaf',.30,-.22,.17,.7],['leaf',-.38,.04,.16,-1.4],['leaf',.38,.04,.16,1.4],
 ['leaf',-.27,.30,.16,-2.2],['leaf',.27,.30,.16,2.2],['leaf',0,-.38,.15,.1],
 ['white',0,-.30,.14,.2],['red',-.19,-.24,.14,0],['red',.19,-.24,.14,1],['white',-.30,-.06,.14,2],['white',.30,-.06,.14,3],
 ['red',-.10,-.10,.15,4],['white',.10,-.10,.15,5],['red',0,.02,.16,0],['white',-.20,.07,.15,1],['red',.20,.07,.15,2],
 ['red',-.10,.17,.15,3],['white',.10,.17,.15,4],['red',-.26,.20,.13,5],['white',.26,.20,.13,6],['red',0,.28,.14,1],
 ['bow',0,.37,.13,0]
];
function dep(d){return d[0]=='leaf'?-.7:d[0]=='bow'?.5:Math.max(-.2,1-Math.hypot(d[1],d[2])/.4);}
var B=ITEMS.map(function(d,i){return{k:d[0],hx:d[1],hy:d[2],r:d[3],a:d[4],i:i,st:0,x:0,y:0,vx:0,vy:0,ang:d[4],va:0,rel:0,
  dp:dep(d),al:1,age:0,fs:1,z:d[0]=='leaf'?0:d[0]=='bow'?3:1.5+dep(d)/2,born:performance.now()/1000+i*.05+.2,sc:0,sx:0,sy:0,sa:0,t0:0};});
var P=[];

function home(b,t){
  var s=rm?0:1;
  return{x:W/2+b.hx*U+Math.sin(t*1.3+b.i)*U*.004*s+TX*b.dp*U*.03,y:H/2-.02*U+b.hy*U+Math.cos(t*1.1+b.i*2)*U*.004*s+TY*b.dp*U*.022,
         a:b.a+Math.sin(t*1.1+b.i*2)*.04*s};
}
function rp(b){return b.r*U*.82*b.fs;}
function isRose(b){return b.k=='red'||b.k=='white';}

function petals(b,n){
  for(var i=0;i<n;i++){
    var a=Math.random()*TAU,s=U*(.3+Math.random()*.9);
    P.push({x:b.x,y:b.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-U*.4,a:Math.random()*TAU,va:(Math.random()-.5)*10,
      l:0,m:1.2+Math.random()*.8,s:U*(.018+Math.random()*.014),
      c:b.k=='white'?(Math.random()<.5?'#ffffff':'#f1e4d8'):(Math.random()<.5?'#c4122f':'#e8465f'),w:b.k=='white'});
  }
}
function launch(b,px,py){
  var r=Math.random;b.age=0;b.al=1;
  if(b.st==0||b.st==2){
    var dx=b.x-W/2,dy=b.y-(H/2-.02*U),a=Math.atan2(dy,dx),sp=U*(1.3+r()*1.4);
    b.st=1;b.rel=++relN;
    b.vx=Math.cos(a)*sp+(r()-.5)*U*.7;
    b.vy=Math.sin(a)*sp-U*(1.1+r()*.9);
    b.va=(r()-.5)*16;
  }else{
    b.vx=(b.x-px)*8+(r()-.5)*U*.9;
    b.vy=-U*(1.2+r()*.8);
    b.va=(r()-.5)*16;
    b.rel=++relN;
  }
  if(isRose(b))petals(b,9);
  try{navigator.vibrate&&navigator.vibrate(8);}catch(e){}
}

/* ---------- loop ---------- */
var last=performance.now()/1000;
function step(now){
  var dt=Math.min(now-last,1/30);last=now;
  var G=U*4.3,i,j,b,c,fr=0,any=false;
  PX+=(QX-PX)*Math.min(1,dt*4);PY+=(QY-PY)*Math.min(1,dt*4);
  TX=(rm?0:Math.sin(now*.6)*.5)+PX;TY=(rm?0:Math.cos(now*.5)*.3)+PY;
  for(i=0;i<B.length;i++){
    b=B[i];
    if(b.st==3){if(isRose(b))fr++;continue;}
    b.sc=Math.max(0,Math.min(1,(now-b.born)/.6));
    b.fs+=((b.st==1?FS:1)-b.fs)*Math.min(1,dt*8);
    if(b.st==0){var h=home(b,now);b.x=h.x;b.y=h.y;b.ang=h.a;}
    else if(b.st==2){
      var k=(now-b.t0)/.9;
      if(k>=1){b.st=0;}
      else if(k>=0){
        var e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2,h2=home(b,now);
        b.x=b.sx+(h2.x-b.sx)*e;b.y=b.sy+(h2.y-b.sy)*e;b.ang=b.sa+(h2.a-b.sa)*e;
      }else{b.x=b.sx;b.y=b.sy;}
    }else{
      var r=rp(b);
      b.vy+=G*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.ang+=b.va*dt;
      b.age+=dt;var lf=b.k=='leaf'?1:3.2;if(b.age>lf){b.al=Math.max(0,1-(b.age-lf)/.7);if(b.al<=0){b.st=3;continue;}}
      if(b.x<r){b.x=r;b.vx=Math.abs(b.vx)*.6;b.va*=.8;}
      if(b.x>W-r){b.x=W-r;b.vx=-Math.abs(b.vx)*.6;b.va*=.8;}
      var fl=H-floorPad-r;
      if(b.y>fl){
        b.y=fl;
        if(Math.abs(b.vy)<U*.35)b.vy=0;else b.vy=-b.vy*.55;
        b.vx*=.97;b.va=b.vx/r;
        if(Math.abs(b.vx)<U*.02)b.vx=0;
      }
    }
    if(b.st==1)any=true;
    if(b.st!=0&&isRose(b))fr++;
  }
  for(i=0;i<B.length;i++){
    var p=B[i];if(p.st!=1)continue;
    for(j=i+1;j<B.length;j++){
      var q=B[j];if(q.st!=1)continue;
      var dx=q.x-p.x,dy=q.y-p.y,d=Math.sqrt(dx*dx+dy*dy)||.01,m=rp(p)+rp(q);
      if(d<m){
        var nx=dx/d,ny=dy/d,ov=(m-d)/2;
        p.x-=nx*ov;p.y-=ny*ov;q.x+=nx*ov;q.y+=ny*ov;
        var rv=(q.vx-p.vx)*nx+(q.vy-p.vy)*ny;
        if(rv<0){var imp=-rv*.6;p.vx-=nx*imp;p.vy-=ny*imp;q.vx+=nx*imp;q.vy+=ny*imp;}
      }
    }
  }
  for(i=P.length-1;i>=0;i--){
    c=P[i];c.l+=dt;
    if(c.l>c.m){P.splice(i,1);continue;}
    c.vy+=G*.25*dt;c.vx*=.985;c.vy*=.985;c.x+=c.vx*dt+Math.sin(c.l*5+c.a)*14*dt;c.y+=c.vy*dt;c.a+=c.va*dt;
  }
  /* draw */
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  B.forEach(function(b4){
    if(b4.st==3||b4.st==2&&now<b4.t0+.9)return;
    var h=Math.max(0,H-floorPad-b4.y),f=Math.min(1,h/(U*1.1)),w=rp(b4)*(1.15-.5*f);
    ctx.fillStyle='rgba(30,0,10,'+(.26*(1-f)*b4.al)+')';
    ctx.beginPath();ctx.ellipse(b4.x,H-floorPad+3,w,w*.2,0,0,TAU);ctx.fill();
  });
  var order=B.slice().sort(function(a,b2){return(a.st==1?10+a.rel:a.z)-(b2.st==1?10+b2.rel:b2.z);});
  order.forEach(function(b3){
    if(b3.st==3)return;
    var s=b3.r*2*(280/224),sc=b3.sc;if(sc<1)sc=1+2.2*Math.pow(sc-1,3)+1.2*Math.pow(sc-1,2);
    sc*=(1+.07*b3.dp)*b3.fs;
    var im=b3.st!=0?SPR[b3.k]:b3.dp<-.4?SPRD[b3.k][1]:b3.dp<.15?SPRD[b3.k][0]:SPR[b3.k];
    ctx.save();ctx.translate(b3.x,b3.y);ctx.rotate(b3.ang);ctx.scale(sc,sc);
    ctx.globalAlpha=b3.al;ctx.drawImage(im,-s*U/2,-s*U/2,s*U,s*U);ctx.restore();
  });
  P.forEach(function(c2){
    ctx.save();ctx.translate(c2.x,c2.y);ctx.rotate(c2.a);ctx.globalAlpha=Math.max(0,1-Math.pow(c2.l/c2.m,2));
    ctx.beginPath();ctx.ellipse(0,0,c2.s*1.5,c2.s,0,0,TAU);ctx.fillStyle=c2.c;ctx.fill();
    if(c2.w){ctx.strokeStyle='rgba(120,90,60,.4)';ctx.lineWidth=1;ctx.stroke();}
    ctx.restore();
  });
  var op=Math.min(1,fr/8);
  if(op!=lastOp){note.style.opacity=op;lastOp=op;}
  var sb=fr>0;
  if(sb!=lastBtn){btn.classList.toggle('show',sb);lastBtn=sb;}
  requestAnimationFrame(function(){step(performance.now()/1000);});
}

/* ---------- input ---------- */
cv.addEventListener('pointerdown',function(e){
  var x=e.clientX,y=e.clientY,now=performance.now()/1000;
  var order=B.slice().sort(function(a,b){return(a.st==1?10+a.rel:a.z)-(b.st==1?10+b.rel:b.z);});
  for(var i=order.length-1;i>=0;i--){
    var b=order[i];
    if(b.st==3)continue;
    if(b.st==2&&now<b.t0+.9)continue;
    var dx=x-b.x,dy=y-b.y;
    if(Math.sqrt(dx*dx+dy*dy)<=b.r*U*.95*b.fs){launch(b,x,y);hint.classList.add('off');break;}
  }
});
btn.addEventListener('click',function(){
  var now=performance.now()/1000,n=0;
  B.forEach(function(b){
    if(b.st==3||(b.st==1&&b.al<1)){b.st=0;b.al=1;b.age=0;b.fs=1;b.sc=0;b.born=now+.5+(n++)*.03;}
    else if(b.st!=0){b.sx=b.x;b.sy=b.y;b.sa=b.ang;b.vx=b.vy=0;b.st=2;b.t0=now+(n++)*.035;b.age=0;b.al=1;}
  });
});

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2.5);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  U=Math.min(W*.98,H*.72);
  var pb=parseFloat(getComputedStyle(document.documentElement).paddingBottom)||0;
  floorPad=pb+66;
  note.style.top=(H/2-.02*U)+'px';
  ttl.style.top=Math.max(pb+34,H/2-.02*U-.53*U-30)+'px';
}
window.addEventListener('resize',resize);
function askTilt(){
  if(tiltOn)return;tiltOn=true;
  var D=window.DeviceOrientationEvent;
  if(D&&typeof D.requestPermission==='function'){
    D.requestPermission().then(function(r){if(r!=='granted')tiltOn=false;}).catch(function(){tiltOn=false;});
  }
}
cv.addEventListener('click',askTilt);
btn.addEventListener('click',askTilt);
window.addEventListener('pointermove',function(e){QX=(e.clientX/W-.5)*2;QY=(e.clientY/H-.5)*2;});
window.addEventListener('deviceorientation',function(e){if(e.gamma!=null&&e.beta!=null){QX=Math.max(-1,Math.min(1,e.gamma/30));QY=Math.max(-1,Math.min(1,(e.beta-45)/30));}});
resize();
requestAnimationFrame(function(){last=performance.now()/1000;step(last);});
})();
</script>
</body>
</html>
