<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bir not</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,500&display=swap">
<style>
:root{
  --bg1:#fbf1ea; --bg2:#f1d9d0; --card:#fffaf5; --ink:#5c0f1d; --line:#e7c9c0; --leaf:#4f7a4a; --leaf2:#3c6139;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg1:#2a0a12; --bg2:#14050a; --card:#3a1520; --ink:#fbe7e2; --line:#6b2c3a; --leaf:#3f6a3c; --leaf2:#2d5030;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg1:#2a0a12; --bg2:#14050a; --card:#3a1520; --ink:#fbe7e2; --line:#6b2c3a; --leaf:#3f6a3c; --leaf2:#2d5030;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{
  margin:0;height:100%;min-height:100%;
  background:radial-gradient(ellipse at 50% 40%,var(--bg1),var(--bg2));
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  font-family:'Playfair Display',Georgia,'Times New Roman',serif;
}
.bouquet{position:relative;width:min(94vw,440px);aspect-ratio:4/5;max-height:92%}
.card{
  position:absolute;left:14%;right:14%;top:21%;bottom:21%;z-index:1;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  display:flex;align-items:center;justify-content:center;text-align:center;padding:6% 7%;
  box-shadow:0 10px 30px rgba(90,10,25,.22);
  opacity:0;animation:in 1.4s .5s ease forwards;
}
.card p{margin:0;color:var(--ink);font-style:italic;font-weight:500;font-size:clamp(1.25rem,6vw,1.7rem);line-height:1.4}
.r,.l{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:auto;aspect-ratio:1;
  transform:translate(-50%,-50%) rotate(var(--r,0deg));opacity:0;animation:in 1.2s var(--d,0s) ease forwards}
.r{z-index:2;filter:drop-shadow(0 4px 5px rgba(60,0,15,.3))}
.l{z-index:0}
.red{--c1:#b3122b;--c2:#d11f3a;--c3:#7d0a1c}
.white{--c1:#efe7dd;--c2:#fffaf3;--c3:#cfc2b4}
.sway{animation:in 1.2s var(--d,0s) ease forwards, sway 6s calc(var(--d,0s) + 1.4s) ease-in-out infinite alternate}
@keyframes in{to{opacity:1}}
@keyframes sway{from{transform:translate(-50%,-50%) rotate(var(--r,0deg))}to{transform:translate(-50%,-52%) rotate(calc(var(--r,0deg) + 4deg))}}
@media (prefers-reduced-motion: reduce){.r,.l,.card{animation:none;opacity:1}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="rose" viewBox="-50 -50 100 100">
    <g stroke="var(--c3)" stroke-width="1.1">
      <g fill="var(--c1)">
        <ellipse cx="0" cy="-24" rx="20" ry="24"/>
        <ellipse cx="0" cy="-24" rx="20" ry="24" transform="rotate(60)"/>
        <ellipse cx="0" cy="-24" rx="20" ry="24" transform="rotate(120)"/>
        <ellipse cx="0" cy="-24" rx="20" ry="24" transform="rotate(180)"/>
        <ellipse cx="0" cy="-24" rx="20" ry="24" transform="rotate(240)"/>
        <ellipse cx="0" cy="-24" rx="20" ry="24" transform="rotate(300)"/>
      </g>
      <g fill="var(--c2)">
        <ellipse cx="0" cy="-14" rx="14" ry="17" transform="rotate(30)"/>
        <ellipse cx="0" cy="-14" rx="14" ry="17" transform="rotate(102)"/>
        <ellipse cx="0" cy="-14" rx="14" ry="17" transform="rotate(174)"/>
        <ellipse cx="0" cy="-14" rx="14" ry="17" transform="rotate(246)"/>
        <ellipse cx="0" cy="-14" rx="14" ry="17" transform="rotate(318)"/>
      </g>
      <circle r="12" fill="var(--c1)"/>
      <path d="M-3 0a3 3 0 1 1 6 0a6 6 0 1 1-12 0a9 9 0 1 1 18 0" fill="none"/>
    </g>
  </symbol>
  <symbol id="leaf" viewBox="-50 -50 100 100">
    <path d="M-45 0C-20-40 25-40 45 0C25 40-20 40-45 0Z" fill="var(--leaf)" stroke="var(--leaf2)" stroke-width="2"/>
    <path d="M-45 0H40" stroke="var(--leaf2)" stroke-width="2"/>
  </symbol>
</svg>

<main class="bouquet" aria-label="Güllerle çevrili bir not">
  <svg class="l" style="--x:30%;--y:24%;--s:22%;--r:-30deg;--d:.1s"><use href="#leaf"/></svg>
  <svg class="l" style="--x:72%;--y:25%;--s:22%;--r:35deg;--d:.15s"><use href="#leaf"/></svg>
  <svg class="l" style="--x:6%;--y:52%;--s:20%;--r:-80deg;--d:.2s"><use href="#leaf"/></svg>
  <svg class="l" style="--x:95%;--y:54%;--s:20%;--r:80deg;--d:.25s"><use href="#leaf"/></svg>
  <svg class="l" style="--x:30%;--y:80%;--s:22%;--r:30deg;--d:.3s"><use href="#leaf"/></svg>
  <svg class="l" style="--x:68%;--y:80%;--s:22%;--r:-35deg;--d:.35s"><use href="#leaf"/></svg>

  <svg class="r red sway" style="--x:18%;--y:12%;--s:34%;--r:10deg;--d:.2s"><use href="#rose"/></svg>
  <svg class="r white sway" style="--x:50%;--y:7%;--s:30%;--r:-12deg;--d:.35s"><use href="#rose"/></svg>
  <svg class="r red sway" style="--x:82%;--y:13%;--s:34%;--r:-8deg;--d:.5s"><use href="#rose"/></svg>
  <svg class="r white sway" style="--x:8%;--y:38%;--s:26%;--r:20deg;--d:.65s"><use href="#rose"/></svg>
  <svg class="r white sway" style="--x:92%;--y:40%;--s:28%;--r:-18deg;--d:.8s"><use href="#rose"/></svg>
  <svg class="r red sway" style="--x:12%;--y:66%;--s:30%;--r:-10deg;--d:.95s"><use href="#rose"/></svg>
  <svg class="r red sway" style="--x:90%;--y:68%;--s:30%;--r:14deg;--d:1.1s"><use href="#rose"/></svg>
  <svg class="r white sway" style="--x:22%;--y:90%;--s:34%;--r:8deg;--d:1.25s"><use href="#rose"/></svg>
  <svg class="r red sway" style="--x:50%;--y:94%;--s:30%;--r:-6deg;--d:1.4s"><use href="#rose"/></svg>
  <svg class="r white sway" style="--x:80%;--y:90%;--s:34%;--r:-14deg;--d:1.55s"><use href="#rose"/></svg>

  <div class="card"><p>Kalbimin ortasında bu nasıl bir cumhuriyet</p></div>
</main>
</body>
</html>
